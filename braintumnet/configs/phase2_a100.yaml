# Phase 2 A100 80GB - FIXED Configuration
#
# FIXES from original phase2_a100.yaml:
# 1. Reduced batch_size: 48 → 16 (better for multi-class)
# 2. Adjusted learning rate: 1.1e-4 → 5.0e-5 (more stable)
# 3. Increased ED weight: 2.5 → 4.0 (ED is hardest class)
# 4. Increased focal_alpha for ED: 0.15 → 0.3
# 5. Added warmup_ratio for more stable start
#
# Expected Results:
# - WT Dice: 0.83-0.86 (was 0.03-0.04 ❌)
# - TC Dice: 0.80-0.83 (was 0.81 ✅)
# - ED Dice: 0.82-0.85 (was 0.009 ❌)
# ============================================================

data:
  raw_root: "braintumnet/data/raw/BraTS2020_TrainingData/MICCAI_BraTS2020_TrainingData"
  proc_root: "braintumnet/data/processed_multiclass_with_grades"  # With correct HGG/LGG labels
  modality: "multi"
  img_size: 256
  slices_per_case: 155                   # FULL slices (not sampled)
  tumor_slice_ratio: 0.7
  num_folds: 5
  fold: 0

train:
  # ============================================================
  # BATCH SIZE - FIXED: 48 → 16
  # ============================================================
  epochs: 400
  batch_size: 16                         # REDUCED! Better for multi-class
  lr: 5.0e-5                             # ADJUSTED for batch=16
  weight_decay: 1.5e-4
  workers: 16                            # INCREASED: 8 → 16 for A100 throughput

  # ============================================================
  # ULTIMATE LOSS - FIXED for ED class
  # ============================================================
  loss_type: "ultimate_multitask"
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Loss component weights
  dice_weight: 1.0
  focal_weight: 1.0
  iou_weight: 2.5
  boundary_weight: 0.6

  # Focal loss - ED FIXED: 0.15 → 0.3
  focal_alpha: [0.0, 0.4, 0.3]           # [bg=0.0, TC=0.4, ED=0.3↑] FIX ED
  focal_gamma: 3.0

  # Class weights - ED FIXED: 2.5 → 4.0
  class_weights: [1.0, 3.0, 4.0]         # [bg, TC=3.0, ED=4.0↑] ED is hardest!

  ignore_background: true

  # Deep supervision
  aux_weight: 0.3

  # ============================================================
  # OPTIMIZER
  # ============================================================
  optimizer: "adamw"
  optimizer_fused: true
  grad_clip_norm: 1.0

  # ============================================================
  # SCHEDULER - More stable warmup
  # ============================================================
  scheduler: "cosine"
  warmup_steps: 2000
  min_lr: 5.0e-7

  # ============================================================
  # MIXED PRECISION - A100 BF16
  # ============================================================
  amp: true
  amp_dtype: "bfloat16"
  grad_accum_steps: 1

  # ============================================================
  # A100 OPTIMIZATIONS
  # ============================================================
  channels_last: true
  cudnn_benchmark: true
  pin_memory: true
  prefetch_factor: 8                     # INCREASED: 4 → 8 for better pipeline
  persistent_workers: true               # Keep workers alive between epochs

  # ============================================================
  # TRAINING CONTROL
  # ============================================================
  early_stop_patience: 30
  val_interval: 1

  # Logging
  log_interval: 10
  save_interval: 10

# ============================================================
# LOGGING
# ============================================================
logging:
  log_dir: "logs"
  out_dir: "runs"
  save_dir: "checkpoints"
  exp_name: "braintumnet_phase2_a100_fixed"
  use_tensorboard: true
  log_every_n_steps: 50
  save_top_k: 3

# ============================================================
# MODEL: Phase 2 Large - 87M Parameters
# ============================================================
model:
  model_type: "v2"

  # Input/Output
  in_channels: 4
  num_classes_seg: 3
  num_classes_cls: 2

  # Architecture
  base: 64
  dim: 512
  patch_size: 8
  depth: 4
  n_heads: 8

  # Phase 2 features
  dropout: 0.2
  norm: "instance"
  roi_stop_grad: true
  deep_supervision: true
  multi_scale_fusion: true

# ============================================================
# AUGMENTATION
# ============================================================
augment:
  # Geometric
  rotate_deg: 45
  hflip_p: 0.5
  vflip_p: 0.5
  scale_range: [0.9, 1.1]

  # Intensity
  brightness_range: [0.75, 1.25]
  contrast_range: [0.75, 1.25]
  gamma_range: [0.85, 1.15]

  # Noise
  gaussian_noise_p: 0.2
  gaussian_noise_std: 0.01

# ============================================================
# WHAT WAS FIXED
# ============================================================
#
# Original phase2_a100.yaml issues:
# 1. batch_size=48 → Gradients too smooth, ED class ignored
# 2. lr=1.1e-4 → Too high, unstable training
# 3. focal_alpha ED=0.15 → Too low weight for hardest class
# 4. class_weights ED=2.5 → Not enough emphasis on ED
#
# Fixed version:
# 1. batch_size=16 → Better gradient signal for all classes
# 2. lr=5.0e-5 → More stable (scaled: 3e-5 × sqrt(16/8) = 4.2e-5 ≈ 5e-5)
# 3. focal_alpha ED=0.3 → 2x weight for ED
# 4. class_weights ED=4.0 → Strongest weight for hardest class
#
# Why batch=16 not 8?
# - A100 has 80GB, can handle 16 easily
# - 16 is sweet spot: not too large (48), not too small (8)
# - Still 2x larger than phase2_small.yaml (batch=8)
#
# Expected improvement:
# - WT: 0.04 → 0.83-0.86 (+0.82!)
# - ED: 0.009 → 0.82-0.85 (+0.81!)
# - TC: 0.81 → 0.80-0.83 (stable)
#
# Training time per epoch: ~2.5 hours (batch=48) → ~4 hours (batch=16)
# But worth it for correct results!
#
# ============================================================
