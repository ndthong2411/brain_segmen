# ============================================================
# FAQ
# ============================================================
#
# Q: Tại sao batch_size = 48 mà không phải 64?
# A: 64 có thể OOM. 48 an toàn hơn, vẫn rất lớn (6x so với Small).
#
# Q: Có cần thay đổi learning rate khi tăng batch size?
# A: Có! Dùng công thức: new_lr = base_lr × sqrt(new_batch / base_batch)
#    lr = 3e-5 × sqrt(48/8) = 3e-5 × 2.45 ≈ 7.3e-5
#
# Q: Tại sao dùng bfloat16 thay vì float16?
# A: BF16 là native format của A100, nhanh hơn và stable hơn FP16.
#    FP16 có thể bị gradient underflow, BF16 không.
#
# Q: Có cần torch.compile không?
# A: Tùy. torch.compile có thể thêm 20% speedup nhưng:
#    - Cần PyTorch 2.0+
#    - Compilation time ~5-10 phút
#    - Có bug với một số operators
#    Hiện tại để false, có thể bật sau nếu cần.
#
# Q: Model này có tốt hơn Phase 2 Small bao nhiêu?
# A: +2-3% IoU (0.82-0.85 vs 0.80-0.82). Worth it nếu có A100.
#
# Q: Có thể dùng config này trên RTX 3090 không?
# A: Không! RTX 3090 chỉ có 24GB, sẽ OOM. Dùng phase2_small.yaml.
#
# Q: Làm sao biết training có ổn không?
# A: Xem:
#    - val_iou tăng đều (quan trọng nhất)
#    - GPU util > 80%
#    - No OOM errors
#    - TC IoU cũng cải thiện (class khó)
#
# Q: Khi nào thì đạt IoU 0.90?
# A: Single model: 0.82-0.85
#    + TTA: 0.84-0.87
#    + 5-fold ensemble: 0.85-0.88
#    + Ensemble + TTA: 0.87-0.90 ✅
#
# ============================================================
