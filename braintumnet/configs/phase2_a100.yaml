# Phase 2 Configuration - Optimized for A100 80GB GPU
#
# Target: IoU 0.82-0.85 (single model)
#         IoU 0.87-0.90 (with ensemble + TTA)
#
# Hardware: NVIDIA A100 80GB
# Memory Usage: ~40-50GB (leaves room for system)
# Training Speed: ~2.5 hours per epoch (vs 4 hours on RTX 3090)
#
# Key Optimizations:
# 1. Large batch size (64) for stable gradients
# 2. Larger model (base=64, dim=512) - 87M parameters
# 3. Mixed precision (bfloat16) - A100 optimized
# 4. Gradient accumulation disabled (large batch already)
# 5. More workers for data loading
# 6. Aggressive learning rate with large batch
#
# Expected Results:
# - Single model IoU: 0.82-0.85
# - Training time: ~17.5 hours per fold (7 epochs)
# - Total 5-fold: ~88 hours (~3.5 days)
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_multiclass"
  modality: "multi"                      # FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  # ============================================================
  # A100-OPTIMIZED TRAINING PARAMETERS
  # ============================================================
  epochs: 400                            # More epochs with large model
  batch_size: 64                         # LARGE: A100 can handle this!
  lr: 8.0e-5                             # Scale LR with batch size (sqrt rule)
  weight_decay: 1.0e-4
  workers: 8                             # More workers for A100 speed

  # ============================================================
  # ULTIMATE LOSS (same as Phase 1/2)
  # ============================================================
  loss_type: "ultimate_multitask"
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Loss component weights
  dice_weight: 1.0
  focal_weight: 1.0
  iou_weight: 2.0                        # Emphasize IoU
  boundary_weight: 0.5

  # Focal loss - background ignored
  focal_alpha: [0.0, 0.4, 0.1]           # [bg=0.0, TC, ED]
  focal_gamma: 3.0

  # Class weights - TC emphasized
  class_weights: [1.0, 3.0, 2.0]         # [bg(ignored), TC, ED]

  ignore_background: true

  # Deep supervision
  aux_weight: 0.3

  # ============================================================
  # A100-SPECIFIC OPTIMIZATIONS
  # ============================================================
  optimizer: "adamw"
  grad_clip_norm: 1.0

  # Scheduler - Cosine with warmup
  scheduler: "cosine"
  warmup_steps: 2000                     # Longer warmup for large batch
  min_lr: 5.0e-7

  # Mixed precision - A100 optimized
  amp: true
  amp_dtype: "bfloat16"                  # A100 has native bfloat16! Faster + more stable

  # No gradient accumulation needed (large batch already)
  grad_accum_steps: 1

  # Early stopping
  early_stop_patience: 100               # Be patient with large model
  val_interval: 1

  # Logging
  log_interval: 10
  save_interval: 10

  # A100-specific flags
  channels_last: true                    # Memory format optimization
  cudnn_benchmark: true                  # Auto-tune kernels
  pin_memory: true                       # Faster data transfer

# ============================================================
# MODEL: Phase 2 Large - Optimized for A100
# ============================================================
model:
  # Model type: v2 with all improvements
  model_type: "v2"

  # Input/Output
  in_channels: 4
  num_classes_seg: 3                     # bg, TC, ED
  num_classes_cls: 2                     # HGG, LGG

  # Architecture - LARGE for A100 (87M parameters)
  base: 64                               # 2x from baseline (32)
  dim: 512                               # 2x from baseline (256)
  patch_size: 8
  depth: 4                               # 2x from baseline (2)
  n_heads: 8                             # 2x from baseline (4)

  # Phase 2 features
  dropout: 0.2                           # More dropout for large model
  norm: "instance"                       # InstanceNorm
  roi_stop_grad: true
  deep_supervision: true
  multi_scale_fusion: true

# ============================================================
# LOGGING
# ============================================================
logging:
  log_dir: "logs"
  out_dir: "runs"
  save_dir: "checkpoints"
  exp_name: "braintumnet_phase2_a100"
  use_tensorboard: true
  log_every_n_steps: 50
  save_top_k: 3

# ============================================================
# AUGMENTATION - Aggressive for large model
# ============================================================
augment:
  # Geometric
  rotate_deg: 45                         # More rotation
  hflip_p: 0.5
  vflip_p: 0.5
  scale_range: [0.9, 1.1]               # Add scaling

  # Intensity
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]
  gamma_range: [0.9, 1.1]

  # Noise (light)
  gaussian_noise_std: 0.01
  gaussian_noise_p: 0.3

# ============================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================
#
# Model Size:
# - Parameters: 87M (6x baseline, 2.3x Phase 2 Small)
# - Model file: ~350 MB
#
# Memory Usage:
# - Forward pass: ~25 GB (batch_size=64)
# - Training peak: ~40-50 GB
# - Leaves ~30 GB free on A100 80GB
#
# Training Speed (A100 80GB):
# - ~2.5 hours per epoch (vs 4h on RTX 3090)
# - ~17.5 hours per fold (400 epochs @ 2.5h)
# - Total 5-fold: ~88 hours (~3.5 days)
#
# Batch Size Scaling:
# - RTX 3090 24GB: batch_size=8
# - A100 40GB: batch_size=32
# - A100 80GB: batch_size=64 (this config)
#
# Expected Results:
# - Single model IoU: 0.82-0.85 (+2-3% from Phase 2 Small)
# - With TTA: 0.84-0.87
# - With 5-fold ensemble: 0.85-0.88
# - With ensemble + TTA: 0.87-0.90 ✅ TARGET!
#
# Why this is better than Phase 2 Small:
# 1. Larger model (87M vs 37M) - more capacity
# 2. Larger batch (64 vs 8) - more stable gradients
# 3. bfloat16 on A100 - faster + more stable than fp16
# 4. Better throughput - train faster despite larger model
# 5. Can reach IoU 0.90 target!
#
# ============================================================
