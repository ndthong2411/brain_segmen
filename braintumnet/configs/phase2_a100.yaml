# Phase 2 A100 80GB - Maximum Performance Configuration
#
# Hardware: NVIDIA A100 80GB (PCIe or SXM)
# Target: IoU 0.82-0.85 (single model), 0.87-0.90 (with ensemble+TTA)
#
# Key Optimizations:
# 1. LARGE BATCH: 48 (tận dụng 80GB VRAM)
# 2. LARGE MODEL: 87M parameters (base=64, dim=512)
# 3. BFLOAT16: Native A100 precision (nhanh hơn FP16)
# 4. CHANNELS_LAST: Tensor cores optimization
# 5. CUDNN_BENCHMARK: Auto-tune CUDA kernels
# 6. AGGRESSIVE AUGMENTATION: Regularization cho model lớn
#
# Expected Performance:
# - GPU Utilization: 85-95%
# - GPU Power: 300-350W
# - Training Speed: ~2-2.5 hours/epoch
# - Total Time: ~14-18 hours/fold (400 epochs)
# - Memory Usage: ~55-65GB
#
# Expected Results:
# - Single model IoU: 0.82-0.85 (BEST single model)
# - With TTA: 0.84-0.87
# - With 5-fold ensemble: 0.85-0.88
# - With ensemble + TTA: 0.87-0.90 ✅ TARGET!
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_multiclass"
  modality: "multi"                      # FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  # ============================================================
  # BATCH SIZE - CRITICAL for A100 80GB
  # ============================================================
  epochs: 400                            # Extended training for large model
  batch_size: 48                         # LARGE! Tận dụng 80GB VRAM
  lr: 1.1e-4                             # Scaled: base_lr × sqrt(batch/8) = 3e-5 × sqrt(48/8) = 3e-5 × 2.45 ≈ 7.3e-5
  weight_decay: 1.5e-4                   # Stronger regularization for large model
  workers: 8                             # A100 có PCIe 4.0, handle được 8 workers

  # ============================================================
  # ULTIMATE LOSS - Optimized for High IoU
  # ============================================================
  loss_type: "ultimate_multitask"
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Loss component weights - Tuned for IoU 0.85+
  dice_weight: 1.0
  focal_weight: 1.0
  iou_weight: 2.5                        # Tăng từ 2.0 → 2.5 (emphasize IoU hơn)
  boundary_weight: 0.6                   # Tăng từ 0.5 → 0.6 (boundaries chính xác hơn)

  # Focal loss - TC emphasized more
  focal_alpha: [0.0, 0.5, 0.15]          # [bg=0.0, TC=0.5↑, ED=0.15↑] - TC bottleneck
  focal_gamma: 3.0

  # Class weights - TC is hardest
  class_weights: [1.0, 4.0, 2.5]         # [bg(ignored), TC=4.0↑, ED=2.5↑]

  ignore_background: true

  # Deep supervision
  aux_weight: 0.3

  # ============================================================
  # OPTIMIZER - A100 Optimized
  # ============================================================
  optimizer: "adamw"
  optimizer_fused: true                  # ✅ Fused AdamW for A100 (10-15% faster)
  grad_clip_norm: 1.0

  # ============================================================
  # SCHEDULER - Cosine with Warmup
  # ============================================================
  scheduler: "cosine"
  warmup_steps: 2000                     # Longer warmup for large batch
  min_lr: 5.0e-7

  # ============================================================
  # MIXED PRECISION - A100 Native BF16
  # ============================================================
  amp: true
  amp_dtype: "bfloat16"                  # ✅ BF16 is FASTER on A100 than FP16
  grad_accum_steps: 1                    # No accumulation (batch already large)

  # ============================================================
  # A100 HARDWARE OPTIMIZATIONS
  # ============================================================
  channels_last: true                    # ✅ Tensor cores optimization (10-20% speedup)
  cudnn_benchmark: true                  # ✅ Auto-tune kernels (5-10% speedup)
  pin_memory: true                       # Fast CPU→GPU transfer
  prefetch_factor: 4                     # Prefetch 4 batches per worker

  # ============================================================
  # TRAINING CONTROL
  # ============================================================
  early_stop_patience: 100               # Patient with large model
  val_interval: 1

  # Logging
  log_interval: 10
  save_interval: 10

# ============================================================
# LOGGING
# ============================================================
logging:
  log_dir: "logs"
  out_dir: "runs"
  save_dir: "checkpoints"
  exp_name: "braintumnet_phase2_a100_80gb"
  use_tensorboard: true
  log_every_n_steps: 50
  save_top_k: 3

# ============================================================
# MODEL: Phase 2 Large - 87M Parameters (A100 Optimized)
# ============================================================
model:
  # Model type: v2 with all improvements
  model_type: "v2"                       # BrainTumNetV2

  # Input/Output
  in_channels: 4
  num_classes_seg: 3                     # bg, TC, ED
  num_classes_cls: 2                     # HGG, LGG

  # ============================================================
  # LARGE ARCHITECTURE - 87M Parameters
  # ============================================================
  base: 64                               # 2x from baseline (32), ~1.3x from small (48)
  dim: 512                               # 2x from baseline (256), ~1.3x from small (384)
  patch_size: 8
  depth: 4                               # Same as small (more depth = slower, diminishing returns)
  n_heads: 8                             # Same as small

  # Phase 2 features
  dropout: 0.2                           # Stronger dropout for large model (0.15 → 0.2)
  norm: "instance"                       # InstanceNorm (medical imaging standard)
  roi_stop_grad: true
  deep_supervision: true
  multi_scale_fusion: true

# ============================================================
# AUGMENTATION - Aggressive for Large Model
# ============================================================
augment:
  # Geometric - More aggressive
  rotate_deg: 45                         # Tăng từ 30 → 45
  hflip_p: 0.5
  vflip_p: 0.5
  scale_range: [0.9, 1.1]               # NEW: Scale augmentation

  # Intensity - More aggressive
  brightness_range: [0.75, 1.25]        # Tăng từ [0.8, 1.2]
  contrast_range: [0.75, 1.25]          # Tăng từ [0.8, 1.2]
  gamma_range: [0.85, 1.15]             # NEW: Gamma correction

  # Noise - Light
  gaussian_noise_p: 0.2                  # NEW: 20% chance add noise
  gaussian_noise_std: 0.01               # Light noise

# ============================================================
# PERFORMANCE CHARACTERISTICS
# ============================================================
#
# Model Statistics:
# - Parameters: 87M (6.1x baseline, 2.3x Phase 2 Small)
# - FLOPs: ~450 GFLOPs per image
# - Model file size: ~350 MB
#
# A100 80GB GPU Utilization:
# - Memory Usage: 55-65 GB (leaves ~15-25GB free)
# - GPU Utilization: 85-95%
# - Power Draw: 300-350W (out of 400W TDP)
# - Temperature: 60-75°C
#
# Training Speed (A100 80GB):
# - Time per batch: ~0.35-0.45 seconds
# - Batches per epoch: ~5735 (with 5-fold split)
# - Time per epoch: ~2-2.5 hours
# - Total training: ~14-18 hours per fold (400 epochs with early stopping)
# - 5-fold total: ~70-90 hours (~3-4 days)
#
# Comparison vs Phase 2 Small (RTX 3090):
# ┌────────────────────────┬─────────────┬──────────────┐
# │ Metric                 │ Small (3090)│ A100 80GB    │
# ├────────────────────────┼─────────────┼──────────────┤
# │ Batch Size             │ 8           │ 48 (6x)      │
# │ Model Parameters       │ 37M         │ 87M (2.3x)   │
# │ GPU Memory             │ ~12 GB      │ ~60 GB       │
# │ Time/Epoch             │ ~3-4 hours  │ ~2-2.5 hours │
# │ Expected Single IoU    │ 0.80-0.82   │ 0.82-0.85    │
# │ Expected Ensemble IoU  │ 0.83-0.85   │ 0.87-0.90 ✅ │
# └────────────────────────┴─────────────┴──────────────┘
#
# Why A100 Reaches Higher IoU:
# 1. Larger Model: 87M params → more capacity → learn complex patterns
# 2. Larger Batch: 48 vs 8 → more stable gradients → better convergence
# 3. BF16 Precision: More stable than FP16 → less numerical errors
# 4. Better Hardware: Faster training → can afford more epochs
# 5. Aggressive Augmentation: Large model won't overfit → better generalization
#
# Expected IoU Progression:
# - Epoch 0-50:   IoU 0.00 → 0.70 (rapid learning)
# - Epoch 50-150: IoU 0.70 → 0.78 (steady improvement)
# - Epoch 150-250: IoU 0.78 → 0.82 (refinement)
# - Epoch 250-400: IoU 0.82 → 0.85 (fine-tuning)
#
# ============================================================

# ============================================================
# USAGE INSTRUCTIONS
# ============================================================
#
# 1. Verify A100 GPU:
#    nvidia-smi
#    # Should show: A100-PCIE-80GB or A100-SXM4-80GB
#
# 2. Check available memory:
#    nvidia-smi --query-gpu=memory.free --format=csv
#    # Should show: ~80000 MiB free
#
# 3. Train single fold:
#    python scripts/train.py --cfg configs/phase2_a100_80gb.yaml --fold 0
#
# 4. Train all 5 folds (sequential):
#    for fold in 0 1 2 3 4; do
#        python scripts/train.py --cfg configs/phase2_a100_80gb.yaml --fold $fold
#    done
#
# 5. Monitor training:
#    # Terminal 1: Training
#    python scripts/train.py --cfg configs/phase2_a100_80gb.yaml --fold 0
#
#    # Terminal 2: GPU monitor
#    watch -n 1 nvidia-smi
#
#    # Terminal 3: TensorBoard
#    tensorboard --logdir=runs
#    # Open: http://localhost:6006
#
#    # Terminal 4: Training monitor
#    python scripts/monitor_training.py --fold 0
#
# 6. Troubleshooting:
#
#    If OOM (Out of Memory):
#      - Reduce batch_size: 48 → 32
#      - Reduce model: base=64 → 56, dim=512 → 448
#      - Check memory leak: nvidia-smi (memory should be stable)
#
#    If GPU util low (< 70%):
#      - Increase workers: 8 → 12
#      - Increase prefetch_factor: 4 → 6
#      - Check CPU bottleneck: htop (all cores should be busy)
#
#    If training slow:
#      - Verify channels_last: true
#      - Verify cudnn_benchmark: true
#      - Verify amp_dtype: "bfloat16" (not "float16")
#      - Check GPU power: Should be 300-350W
#
#    If IoU not improving:
#      - Check TC IoU (bottleneck class)
#      - Increase TC weight: class_weights: [1.0, 5.0, 2.5]
#      - Increase IoU weight: iou_weight: 3.0
#      - Check data loading: Verify processed_multiclass exists
#
# 7. Expected nvidia-smi output during training:
#
#    +-----------------------------------------------------------------------------+
#    | NVIDIA-SMI 525.xx       Driver Version: 525.xx       CUDA Version: 12.x   |
#    |-------------------------------+----------------------+----------------------+
#    | GPU  Name        Persistence-M| Bus-Id        Disp.A | Volatile Uncorr. ECC |
#    | Fan  Temp  Perf  Pwr:Usage/Cap|         Memory-Usage | GPU-Util  Compute M. |
#    |===============================+======================+======================|
#    |   0  NVIDIA A100-PCIE...  On   | 00000000:00:00.0 Off |                    0 |
#    | N/A   68C    P0   325W / 400W |  62000MiB / 81920MiB |     92%      Default |
#    +-------------------------------+----------------------+----------------------+
#
#    ✅ Good indicators:
#      - Power: 300-350W (75-85% of 400W)
#      - Memory: 55-65GB (68-79% of 80GB)
#      - GPU Util: 85-95%
#      - Temperature: 60-75°C
#
# 8. After training all folds:
#
#    # Evaluate ensemble
#    python scripts/ensemble_inference.py \
#        --models checkpoints/braintumnet_phase2_a100_80gb_fold*_best.pth \
#        --use-tta
#
#    # Expected result: IoU 0.87-0.90 ✅
#
# ============================================================

