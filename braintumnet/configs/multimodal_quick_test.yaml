exp_name: "braintumnet_multimodal_quick_test"

data:
  raw_root: "data/raw"
  proc_root: "data/processed_multimodal"  # Use different folder for multi-modal data
  modality: "multi"                        # All 4 modalities
  img_size: 256
  slices_per_case: 20
  tumor_slice_ratio: 0.7
  num_folds: 5
  fold: 0

train:
  epochs: 3              # Quick test with just 3 epochs
  batch_size: 4          # Small batch size for testing
  lr: 1.0e-4
  weight_decay: 0.0
  workers: 0             # No multiprocessing for testing
  seg_loss_weight: 1.0
  cls_loss_weight: 0.7
  scheduler: "cosine"
  amp: false             # Disable AMP for testing

model:
  in_channels: 4         # 4 modalities: FLAIR, T1, T1CE, T2
  num_classes_seg: 1
  num_classes_cls: 2     # HGG vs LGG
  base: 16               # Smaller model for quick testing
  patch_size: 8
  dim: 128
  n_heads: 4
  depth: 1               # Shallow transformer
  roi_stop_grad: true

augment:
  rotate_deg: 15
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
