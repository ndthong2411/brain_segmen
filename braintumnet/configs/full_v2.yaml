exp_name: "braintumnet_improved_v2_boundary_loss"

# IMPROVEMENTS ADDED (cumulative from v1):
# 1. Deep Supervision: Auxiliary losses at decoder levels d3, d2, d1
# 2. Boundary Loss: Penalize boundary errors more heavily (+3-5% IoU expected)
# 3. Extended training: 250 epochs (from 150)
# 4. Cosine annealing scheduler: Better LR decay than plateau
# 5. Longer warmup: 1000 steps (from 500)
# 6. Matched paper LR: 1.0e-4 (from 1.5e-4)

data:
  raw_root: "data/raw"
  proc_root: "data/processed_full_multimodal"  # Full dataset with 4 modalities
  modality: "multi"                             # All 4 modalities: FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  epochs: 250
  batch_size: 12
  lr: 1.0e-4
  weight_decay: 1.0e-4
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # NEW: Boundary loss weight (TARGET FOR IoU improvement)
  boundary_loss_weight: 0.2                      # CHANGED: 0.0 → 0.2

  # Deep supervision auxiliary loss weights
  aux_loss_weights: [0.5, 0.25, 0.125]

  scheduler: "cosine"
  amp: true
  early_stop_patience: 50
  warmup_steps: 1000
  min_lr: 1.0e-6

model:
  in_channels: 4
  num_classes_seg: 1
  num_classes_cls: 2
  base: 32
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true
  deep_supervision: true

augment:
  rotate_deg: 20
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
