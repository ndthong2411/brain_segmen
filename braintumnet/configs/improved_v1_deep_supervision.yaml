exp_name: "braintumnet_improved_v1_deep_supervision"

# IMPROVEMENTS ADDED:
# 1. Deep Supervision: Auxiliary losses at decoder levels d3, d2, d1
# 2. Extended training: 250 epochs (from 150)
# 3. Cosine annealing scheduler: Better LR decay than plateau
# 4. Longer warmup: 1000 steps (from 500)
# 5. Matched paper LR: 1.0e-4 (from 1.5e-4)

data:
  raw_root: "data/raw"
  proc_root: "data/processed_full_multimodal"  # Full dataset with 4 modalities
  modality: "multi"                             # All 4 modalities: FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30                           # More slices per case (we have full dataset)
  tumor_slice_ratio: 0.5                        # Balance tumor/non-tumor
  num_folds: 5
  fold: 0

train:
  epochs: 250                                    # CHANGED: 150 → 250 (match paper)
  batch_size: 12                                 # Keep same (memory constraint)
  lr: 1.0e-4                                     # CHANGED: 1.5e-4 → 1.0e-4 (match paper)
  weight_decay: 1.0e-4                           # Strong regularization
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # NEW: Boundary loss weight
  boundary_loss_weight: 0.0                      # START: 0.0, will enable in v2 after testing

  # NEW: Deep supervision auxiliary loss weights
  # These weights are applied to auxiliary outputs at d3, d2, d1
  # Decreasing weights: d3 (64x64) → d2 (128x128) → d1 (256x256)
  aux_loss_weights: [0.5, 0.25, 0.125]

  # CHANGED: Scheduler from plateau to cosine
  scheduler: "cosine"                            # CHANGED: "plateau" → "cosine"

  amp: true                                      # CRITICAL for 4-channel input
  early_stop_patience: 50                        # CHANGED: 30 → 50 (for 250 epochs)

  # CHANGED: Warmup steps
  warmup_steps: 1000                             # CHANGED: 500 → 1000
  min_lr: 1.0e-6                                 # Minimum LR

model:
  in_channels: 4                                 # 4 MRI modalities
  num_classes_seg: 1                             # Binary tumor segmentation
  num_classes_cls: 2                             # HGG vs LGG classification
  base: 32                                       # Balanced model size
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true                            # Stabilize training

  # NEW: Enable deep supervision
  deep_supervision: true                         # NEW: Enable auxiliary losses

augment:
  rotate_deg: 20                                 # Moderate rotation
  hflip_p: 0.5                                   # Horizontal flip
  vflip_p: 0.5                                   # Vertical flip

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
