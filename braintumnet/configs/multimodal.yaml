exp_name: "braintumnet_multimodal"

data:
  raw_root: "data/raw"
  proc_root: "data/processed_multimodal"  # Use different folder for multi-modal data
  modality: "multi"                        # All 4 modalities
  img_size: 256
  slices_per_case: 20
  tumor_slice_ratio: 0.7
  num_folds: 5
  fold: 0

train:
  epochs: 250
  batch_size: 16         # May need to reduce to 8 if GPU memory is limited
  lr: 1.0e-4
  weight_decay: 0.0
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.7
  scheduler: "cosine"
  amp: true              # Recommended for 4-channel input

model:
  in_channels: 4         # 4 modalities: FLAIR, T1, T1CE, T2
  num_classes_seg: 1
  num_classes_cls: 2     # HGG vs LGG
  base: 32
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true

augment:
  rotate_deg: 30
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
