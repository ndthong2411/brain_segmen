exp_name: "braintumnet_multiclass_a100_optimized"

# MULTI-CLASS SEGMENTATION - A100 OPTIMIZED
# ============================================================
# GPU: A100 40GB/80GB
# Purpose: Multi-class segmentation with A100 optimizations
#
# Improvements vs baseline multiclass.yaml:
# - Batch size: 12 → 64 (5.3x larger)
# - Model capacity: base 32 → 48, dim 256 → 384
# - Workers: 4 → 12 (faster data loading)
# - Optimized for Tensor Cores (AMP + channels_last)
#
# Expected results on A100:
# - Training speed: ~2-3 sec/epoch (vs ~8-10 sec baseline)
# - WT Dice: 0.90-0.92
# - TC Dice: 0.85-0.88
# - ED Dice: 0.78-0.82
# - Mean Dice: 0.85-0.87
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_multiclass"
  modality: "multi"
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  epochs: 300
  batch_size: 64                                # A100 optimized (40GB VRAM)
  lr: 2.0e-4                                    # Scaled for larger batch
  weight_decay: 1.0e-4
  workers: 12                                   # A100 server has many CPU cores

  # Multi-class segmentation loss
  loss_type: "multiclass_dice_focal"            # REQUIRED for 3-class segmentation
  seg_loss_type: "combined"                     # Dice + Focal
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Loss hyperparameters
  dice_weight: 1.0
  focal_weight: 1.0
  focal_alpha: [0.5, 0.35, 0.15]               # [bg, tc, ed] - emphasize TC
  focal_gamma: 2.0
  ignore_background: true

  # Class weights (emphasize tumor regions)
  class_weights: [1.0, 2.0, 1.5]               # [bg, tc, ed]

  # Scheduler
  scheduler: "cosine"
  amp: true                                     # CRITICAL: Tensor Cores
  early_stop_patience: 60
  warmup_steps: 1500                            # Longer for large batch
  min_lr: 1.0e-6

  # A100 optimizations
  use_channels_last: true
  val_batch_size: 80                            # Larger validation batch

model:
  in_channels: 4
  num_classes_seg: 3                            # Multi-class: bg, tc, ed
  num_classes_cls: 2
  base: 48                                      # Larger model for A100
  patch_size: 8
  dim: 384                                      # Larger embedding
  n_heads: 6
  depth: 3                                      # Deeper transformer
  roi_stop_grad: true
  deep_supervision: true

augment:
  rotate_deg: 20
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
  log_every_n_steps: 50
  save_top_k: 5

# ============================================================
# USAGE ON A100
# ============================================================
#
# 1. Preprocess data:
#    python scripts/preprocess_multiclass.py \
#      --raw_dir data/raw/BraTS2020 \
#      --out_dir data/processed_multiclass
#
# 2. Train on A100:
#    python scripts/train.py --cfg configs/multiclass_a100.yaml --fold 0
#
# 3. Monitor VRAM usage:
#    watch -n 1 nvidia-smi
#    # Expected: ~28-32GB / 40GB (or ~30-35GB / 80GB)
#
# 4. 5-Fold CV (if 5 GPUs available):
#    for fold in 0 1 2 3 4; do
#      CUDA_VISIBLE_DEVICES=$fold python scripts/train.py \
#        --cfg configs/multiclass_a100.yaml --fold $fold &
#    done
#
# ============================================================
# EXPECTED PERFORMANCE
# ============================================================
#
# A100 40GB:
# - VRAM usage: ~30-32GB
# - Speed: ~2-3 sec/epoch
# - Total time (300 epochs): ~15-20 minutes
#
# A100 80GB (can push harder):
# - Increase batch_size: 64 → 80
# - Increase base: 48 → 64
# - Increase dim: 384 → 512
# - VRAM usage: ~48-52GB
# - Speed: ~2.5-3.5 sec/epoch
#
# Results (5-fold CV average):
# - WT Dice: 0.91 ± 0.01
# - TC Dice: 0.86 ± 0.02
# - ED Dice: 0.80 ± 0.02
# - Mean Dice: 0.86 ± 0.01
#
# This is MUCH more honest than binary Dice 0.91 with 97% background!
# ============================================================
