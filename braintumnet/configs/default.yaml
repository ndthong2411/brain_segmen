exp_name: "braintumnet_brats2020"

data:
  raw_root: "data/raw"
  proc_root: "data/processed"
  modality: "t1ce"         # one of: t1, t1ce, t2, flair, multi(=4ch)
  img_size: 256
  slices_per_case: 20
  tumor_slice_ratio: 0.7    # fraction of tumor slices in dataset
  num_folds: 5
  fold: 0

train:
  epochs: 250
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.0
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.7
  scheduler: "cosine"       # cosine or none
  amp: true                 # mixed precision

model:
  in_channels: 1            # 1 for single modality, 4 for multi
  num_classes_seg: 1
  num_classes_cls: 2        # HGG vs LGG
  base: 32
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true

augment:
  rotate_deg: 30
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
