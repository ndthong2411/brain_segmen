# SegUNetV2 Phase 1 Optimized Configuration
# Auto-loaded when --model segunetv2_phase1 is specified
#
# IMPROVEMENTS over baseline segunetv2:
# 1. Boundary refinement module
# 2. SGDR scheduler with warm restarts
# 3. Advanced medical augmentation
# 4. Optimized loss weights
# 5. Deep supervision scheduling
# 6. Gradient centralization
#
# Expected: Dice 0.91-0.94 (vs baseline 0.8699)

model:
  model_type: "v2"  # Use v2 (same as segunetv2)
  in_channels: 4
  num_classes_seg: 3
  num_classes_cls: 2

  # SegUNetV2 specific (Phase 2 Large - same as baseline)
  base: 64
  dim: 512
  patch_size: 8
  depth: 4
  n_heads: 8
  dropout: 0.2
  norm: "instance"
  roi_stop_grad: true
  deep_supervision: true
  multi_scale_fusion: true

  # PHASE 1 NEW FEATURES
  boundary_refinement: true  # NEW! Boundary refinement module (+2-3% Dice)

# Training configuration
train:
  # Classification weight
  cls_loss_weight: 0.5

  # PHASE 1: OPTIMIZED LOSS WEIGHTS
  boundary_weight: 1.0              # INCREASED from 0.6 (fix IoU-Dice gap)
  focal_alpha: [0.0, 0.35, 0.35]    # REBALANCED (was [0.0, 0.4, 0.3])
  class_weights: [1.0, 2.5, 3.0]    # ADJUSTED (was [1.0, 3.0, 4.0])

  # PHASE 1: DEEP SUPERVISION SCHEDULING
  aux_weight_initial: 0.5           # Start with strong deep supervision
  aux_weight_final: 0.1             # Reduce to focus on main output

  # PHASE 1: SGDR SCHEDULER
  scheduler: "cosine_restarts"      # CHANGED from "cosine"
  T_0: 50                           # Initial restart period
  T_mult: 2                         # Period multiplier
  min_lr: 1.0e-6                    # INCREASED from 5e-7
  warmup_steps: 3000                # INCREASED from 2000
  early_stop_patience: 50           # INCREASED from 30

  # PHASE 1: GRADIENT CENTRALIZATION
  gradient_centralization: true     # NEW! (+0.3-0.7% Dice)

# PHASE 1: ADVANCED MEDICAL AUGMENTATION
augment:
  # Standard geometric
  rotate_deg: 45
  hflip_p: 0.5
  vflip_p: 0.5
  scale_range: [0.9, 1.1]

  # Standard intensity
  brightness_range: [0.75, 1.25]
  contrast_range: [0.75, 1.25]
  gamma_range: [0.7, 1.4]          # EXPANDED

  # Standard noise
  gaussian_noise_p: 0.2
  gaussian_noise_std: 0.01

  # ADVANCED MEDICAL (NEW)
  elastic_deform_p: 0.3             # Anatomical variations
  elastic_alpha: 30
  elastic_sigma: 4

  bias_field_p: 0.5                 # MRI inhomogeneity
  bias_field_scale: 0.3

  gaussian_blur_p: 0.2              # Partial volume effects
  gaussian_blur_sigma: [0.5, 1.5]

  gamma_p: 0.5                      # Per-modality intensity variations

  cutout_p: 0.2                     # Missing data robustness
  cutout_n_holes: 3
  cutout_size: 20

  local_shuffle_p: 0.15             # Texture randomization
  local_shuffle_size: 3
