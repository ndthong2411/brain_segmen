# SegUNetV2 Model Configuration (Baseline)
# Auto-loaded when --model segunetv2 is specified

model:
  model_type: "segunetv2"
  in_channels: 4
  num_classes_seg: 3
  num_classes_cls: 2

  # SegUNetV2 specific (Phase 2 Large)
  base: 64
  dim: 512
  patch_size: 8
  depth: 4
  n_heads: 8
  dropout: 0.2
  roi_stop_grad: true
  deep_supervision: true
  multi_scale_fusion: true

# SegUNetV2 has classification, so enable it
train:
  cls_loss_weight: 0.5  # Enable classification
