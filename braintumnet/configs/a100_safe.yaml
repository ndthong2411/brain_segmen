exp_name: "braintumnet_a100_safe"

# A100 SAFE CONFIGURATION (for 40GB VRAM)
# ============================================================
# Use this config if a100_optimized.yaml causes VRAM overflow
# More conservative settings while still utilizing A100 capabilities
# Guaranteed to fit in 40GB VRAM with ~20-25GB usage
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_full_multimodal"
  modality: "multi"                             # All 4 modalities: FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  epochs: 300
  batch_size: 24                                 # SAFE: 24 vs 32 (aggressive)
  lr: 1.7e-4                                     # Scaled down for smaller batch
  weight_decay: 1.0e-4
  workers: 8                                     # Keep high for A100 PCIe 4.0
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Boundary loss for IoU improvement
  boundary_loss_weight: 0.2

  # Deep supervision auxiliary loss weights
  aux_loss_weights: [0.5, 0.25, 0.125]

  # Scheduler settings
  scheduler: "cosine"
  amp: true                                      # Still use Tensor Cores
  early_stop_patience: 60
  warmup_steps: 1200                             # Adjusted for batch_size=24
  min_lr: 1.0e-6

  # A100 optimizations
  use_channels_last: true

model:
  in_channels: 4
  num_classes_seg: 1
  num_classes_cls: 2
  base: 40                                       # SAFE: 40 vs 48 (aggressive)
  patch_size: 8
  dim: 320                                       # SAFE: 320 vs 384 (aggressive)
  n_heads: 5                                     # Adjusted to match dim=320
  depth: 2                                       # SAFE: 2 vs 3 (aggressive)
  roi_stop_grad: true
  deep_supervision: true

augment:
  rotate_deg: 20
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true

# Performance expectations:
# - VRAM usage: ~20-25GB (safe for 40GB A100)
# - Training speed: ~2.5-3.5 sec/epoch
# - Total time: ~15-18 minutes for 300 epochs
# - Expected results: Dice 0.92+, IoU 0.89+
