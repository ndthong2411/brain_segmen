# Phase 2 A100 80GB - MAXIMUM OPTIMIZATION
#
# Problem Solved: GPU utilization was only 4% (CPU bottleneck)
# Solution: Aggressive data loading + compute optimizations
#
# Target: 90-100% GPU utilization, 300-350W power usage
# Expected IoU: 0.85-0.88 (single model)
#
# Key Optimizations:
# 1. WORKERS: 16 (was 8) - maximize CPU preprocessing
# 2. PREFETCH: 4 (was 2) - keep GPU fed
# 3. BATCH SIZE: 32 (safe for 80GB)
# 4. CHANNELS_LAST: True - A100 tensor cores
# 5. CUDNN_BENCHMARK: True - auto-tune kernels
# 6. BF16: Native A100 precision
# 7. COMPILE: torch.compile for 20-30% speedup
#
# Expected Performance:
# - GPU Util: 90-100% (was 4%)
# - Power: 300-350W (was 73W)
# - Speed: 3-4 batches/sec (was ~0.5)
# - Time/epoch: 1-1.5 hours (was 4-6 hours)
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_multiclass"
  modality: "multi"                      # FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  # ============================================================
  # CRITICAL: DATA LOADING OPTIMIZATION (Fix 4% GPU util)
  # ============================================================
  workers: 16                            # DOUBLED from 8 - keep GPU fed!
  prefetch_factor: 4                     # DOUBLED from 2 - preload more
  
  # ============================================================
  # TRAINING PARAMETERS - A100 Optimized
  # ============================================================
  epochs: 400                            # Extended training for large model
  batch_size: 32                         # Balanced: memory vs throughput
  val_batch_size: 64                     # Larger batch for validation (no gradients)
  
  lr: 6.0e-5                             # Scaled for batch_size=32 (sqrt rule)
  weight_decay: 1.5e-4                   # Regularization
  
  # ============================================================
  # A100 COMPUTE OPTIMIZATIONS (Fix low power usage)
  # ============================================================
  channels_last: true                    # ✅ Tensor cores optimization
  cudnn_benchmark: true                  # ✅ Auto-tune CUDA kernels
  use_compile: true                      # ✅ PyTorch 2.0 compile (20-30% speedup)
  compile_mode: "max-autotune"           # ✅ Aggressive optimization
  
  # ============================================================
  # MIXED PRECISION - A100 Native
  # ============================================================
  amp: true
  amp_dtype: "bfloat16"                  # ✅ BF16 is FASTER than FP16 on A100
  
  # No gradient accumulation (batch already large)
  grad_accum_steps: 1
  
  # ============================================================
  # LOSS CONFIGURATION (Phase 1 Ultimate Loss)
  # ============================================================
  loss_type: "ultimate_multitask"
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Loss component weights - optimized for high IoU
  dice_weight: 1.0
  focal_weight: 1.0
  iou_weight: 3.0                        # ✅ Maximize IoU (was 2.0)
  boundary_weight: 0.8                   # ✅ Better boundaries (was 0.5)

  # Focal loss - class balance
  focal_alpha: [0.0, 0.5, 0.2]           # [bg=ignore, TC=0.5, ED=0.2]
  focal_gamma: 3.0

  # Class weights - emphasize tumor core
  class_weights: [1.0, 4.0, 2.5]         # [bg(ignored), TC, ED]

  ignore_background: true

  # Deep supervision
  aux_weight: 0.3

  # ============================================================
  # OPTIMIZER & SCHEDULER
  # ============================================================
  optimizer: "adamw"
  optimizer_fused: true                  # ✅ Fused AdamW for A100
  grad_clip_norm: 3.0                    # Prevent gradient explosion

  # Cosine scheduler with warmup
  scheduler: "cosine"
  warmup_steps: 1000                     # Warm up over 1000 steps
  min_lr: 1.0e-6

  # ============================================================
  # TRAINING CONTROL
  # ============================================================
  early_stop_patience: 60                # Be patient with large model
  val_interval: 1                        # Validate every epoch

  # Logging
  log_interval: 5                        # Log every 5 steps
  save_interval: 5                       # Save every 5 epochs

# ============================================================
# MODEL: Large Architecture for A100
# ============================================================
model:
  # Use existing BrainTumNet (v1)
  model_type: "v1"

  # Input/Output
  in_channels: 4
  num_classes_seg: 3                     # bg, TC, ED
  num_classes_cls: 2                     # HGG, LGG

  # ============================================================
  # LARGE ARCHITECTURE - ~87M parameters
  # ============================================================
  base: 64                               # 2x baseline (32)
  dim: 512                               # 2x baseline (256)
  patch_size: 8
  depth: 4                               # 2x baseline (2)
  n_heads: 8                             # 2x baseline (4)

  # Features
  dropout: 0.2                           # Regularization
  norm: "instance"                       # Best for medical imaging
  roi_stop_grad: true
  deep_supervision: true
  multi_scale_fusion: true               # If implemented

# ============================================================
# AUGMENTATION - Aggressive for Large Model
# ============================================================
augment:
  # Geometric augmentations
  rotate_deg: 45                         # Strong rotation
  hflip_p: 0.5
  vflip_p: 0.5
  
  # Intensity augmentations
  brightness_range: [0.75, 1.25]
  contrast_range: [0.75, 1.25]
  
  # Add noise for robustness
  gaussian_noise_p: 0.2
  gaussian_noise_std: 0.02

# ============================================================
# LOGGING
# ============================================================
logging:
  log_dir: "logs"
  exp_name: "braintumnet_phase2_a100_optimized"
  tensorboard: true
  save_predictions: true

# ============================================================
# EXPECTED PERFORMANCE - A100 80GB
# ============================================================
#
# GPU UTILIZATION (BEFORE vs AFTER):
# - GPU Util: 4% → 90-100% ✅
# - Power: 73W → 300-350W ✅
# - Memory: 36GB → 50-60GB ✅
#
# TRAINING SPEED:
# - Batches/sec: ~0.5 → 3-4 batches/sec ✅
# - Time/epoch: 4-6h → 1-1.5h ✅
# - Total (400 epochs): ~2400h → 400-600h ✅
#
# MODEL STATISTICS:
# - Parameters: 87M (vs 37M Phase 2 Small)
# - FLOPs: ~450 GFLOPs/image
# - Memory: ~50-60GB peak (batch=32)
#
# ACCURACY GAINS:
# - Baseline V1: IoU 0.7263
# - Phase 1: IoU 0.75-0.80 (better loss)
# - Phase 2 Small: IoU 0.80-0.82 (larger model)
# - Phase 2 A100: IoU 0.85-0.88 (this config) ✅
# - With TTA: IoU 0.87-0.90 ✅
# - With 5-fold ensemble: IoU 0.88-0.91 ✅
#
# WHY THIS FIXES 4% GPU UTILIZATION:
# ============================================================
# Root Cause: CPU can't prepare data fast enough for GPU
#
# Solutions Applied:
# 1. workers: 8 → 16
#    - 16 parallel CPU processes loading data
#    - Keeps GPU fed even at high batch rates
#
# 2. prefetch_factor: 2 → 4
#    - Each worker preloads 4 batches (was 2)
#    - Total prefetched: 16 workers × 4 = 64 batches ready
#
# 3. val_batch_size: 32 → 64
#    - Validation has no gradients, can use 2x batch
#    - Faster validation
#
# 4. persistent_workers: True (already enabled)
#    - Workers stay alive between epochs
#    - No overhead from recreating processes
#
# 5. pin_memory: True (already enabled)
#    - Direct CPU→GPU transfer (no staging)
#
# 6. channels_last: True (NEW)
#    - Memory layout optimized for A100 tensor cores
#    - 10-20% faster convolutions
#
# 7. cudnn_benchmark: True (NEW)
#    - Auto-tunes CUDA kernels for your data shape
#    - 5-10% speedup after warmup
#
# 8. use_compile: True (NEW)
#    - PyTorch 2.0 graph optimization
#    - 20-30% speedup (one-time compilation cost)
#
# 9. amp_dtype: bfloat16 (was float16 or not set)
#    - A100 has NATIVE BF16 support
#    - Faster than FP16, more stable than FP32
#
# 10. optimizer_fused: True (NEW)
#     - Fused AdamW kernel (single CUDA call)
#     - 10-15% faster optimizer step
#
# Expected Result:
# - GPU util: 4% → 90-100% ✅
# - Power: 73W → 300-350W ✅
# - Training speed: 4-8x faster ✅
# ============================================================

# ============================================================
# USAGE INSTRUCTIONS
# ============================================================
# 1. Verify A100 and data:
#    python verify_setup.py
#
# 2. Monitor GPU before training:
#    watch -n 1 nvidia-smi
#
# 3. Start training:
#    python scripts/train.py --cfg configs/phase2_a100_o.yaml --fold 0
#
# 4. Expected nvidia-smi during training:
#    GPU Util: 90-100% (was 4%)
#    Power: 300-350W (was 73W)
#    Memory: 50-60GB (was 36GB)
#    Temp: 60-75°C
#
# 5. Monitor training:
#    tensorboard --logdir logs/braintumnet_phase2_a100_optimized
#
# 6. If GPU util still low:
#    - Increase workers to 24
#    - Increase prefetch_factor to 6
#    - Check CPU usage (should be 100% across all cores)
#    - Check disk I/O (should be high)
#
# 7. If OOM (Out of Memory):
#    - Reduce batch_size to 24 or 16
#    - Reduce val_batch_size to 48 or 32
#    - Disable use_compile temporarily
#
# ============================================================
# MONITORING CHECKLIST
# ============================================================
# During training, you should see:
# ✅ GPU Util: 90-100% (sustained)
# ✅ GPU Power: 300-350W
# ✅ GPU Memory: 50-60GB
# ✅ CPU Usage: High across all cores
# ✅ Disk I/O: High (data loading)
# ✅ Training speed: 3-4 batches/sec
# ✅ Time/epoch: 1-1.5 hours
#
# If GPU util drops below 80%:
# 1. Check CPU - should be maxed out
# 2. Check disk I/O - should be high
# 3. Increase workers if CPU not maxed
# 4. Check data loading time in logs
# ============================================================
