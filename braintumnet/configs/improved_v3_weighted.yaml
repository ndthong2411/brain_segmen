exp_name: "braintumnet_v3_weighted"

# IMPROVEMENT v3: Class Weighted Loss
# ============================================================
# Problem: 97% background, 3% tumor → model biased to background
# Solution: Weight positive class (tumor) higher in BCE loss
# Expected: +1-2% Dice/IoU improvement over v2
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_full_multimodal"
  modality: "multi"
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  epochs: 250
  batch_size: 12
  lr: 1.0e-4
  weight_decay: 1.0e-4
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # NEW: Loss type and weights for class imbalance
  loss_type: "dice_ce_weighted"                 # Use weighted BCE
  pos_weight: 32.0                               # 97/3 ≈ 32 (bg/tumor ratio)

  # Boundary loss
  boundary_loss_weight: 0.2

  # Deep supervision
  aux_loss_weights: [0.5, 0.25, 0.125]

  scheduler: "cosine"
  amp: true
  early_stop_patience: 50
  warmup_steps: 1000
  min_lr: 1.0e-6

model:
  in_channels: 4
  num_classes_seg: 1
  num_classes_cls: 2
  base: 32
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true
  deep_supervision: true

augment:
  rotate_deg: 20
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true

# Expected Results:
# - Dice: 0.92-0.925 (vs 0.91 baseline)
# - IoU: 0.86-0.87 (vs 0.84 baseline)
# - Training: Same speed as v2
