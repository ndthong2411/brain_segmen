exp_name: "braintumnet_v4_focal"

# IMPROVEMENT v4: Focal Loss (BEST for severe imbalance)
# ============================================================
# Problem: 97% background, 3% tumor → model biased to background
# Solution: Focal Loss - down-weights easy examples, focuses on hard tumor pixels
# Expected: +2-3% Dice/IoU improvement over v2 (BEST solution)
#
# Focal Loss benefits:
# - Automatically handles class imbalance
# - Focuses on hard-to-classify tumor boundaries
# - Proven effective for medical image segmentation
# ============================================================

data:
  raw_root: "data/raw"
  proc_root: "data/processed_full_multimodal"
  modality: "multi"
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.5
  num_folds: 5
  fold: 0

train:
  epochs: 250
  batch_size: 12
  lr: 1.0e-4
  weight_decay: 1.0e-4
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # NEW: Focal Loss for severe class imbalance
  loss_type: "dice_focal"                       # Dice + Focal Loss
  focal_alpha: 0.25                             # Weight for positive class
  focal_gamma: 2.0                              # Focusing parameter (2.0 = standard)
                                                # Higher gamma = more focus on hard examples

  # Boundary loss
  boundary_loss_weight: 0.2

  # Deep supervision
  aux_loss_weights: [0.5, 0.25, 0.125]

  scheduler: "cosine"
  amp: true
  early_stop_patience: 50
  warmup_steps: 1000
  min_lr: 1.0e-6

model:
  in_channels: 4
  num_classes_seg: 1
  num_classes_cls: 2
  base: 32
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true
  deep_supervision: true

augment:
  rotate_deg: 20
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true

# Expected Results (BEST):
# - Dice: 0.925-0.93 (vs 0.91 baseline = +1.5-2%)
# - IoU: 0.87-0.88 (vs 0.84 baseline = +3-4%)
# - Better tumor boundary accuracy
# - Training: Same speed as v2

# Focal Loss Parameters Tuning:
# - focal_alpha: 0.25 (standard) - can try 0.5 for more tumor focus
# - focal_gamma: 2.0 (standard) - can try 3.0 for harder examples
#   Higher gamma = more aggressive focusing
