# Phase 2 Configuration - Small Model (Recommended)
#
# Target: IoU 0.80-0.85 (+5-6% from Phase 1)
#
# Improvements from Phase 1:
# 1. Larger model: 14M → 37M parameters (2.6x)
# 2. InstanceNorm instead of BatchNorm
# 3. LeakyReLU instead of ReLU
# 4. Residual connections in all blocks
# 5. Strided conv instead of MaxPool
# 6. Multi-scale fusion
# 7. Dropout regularization
#
# Expected Results:
# - Single model IoU: 0.80-0.82
# - With TTA: 0.82-0.84
# - With ensemble: 0.83-0.85
# ============================================================

data:
  raw_root: "braintumnet/data/raw/BraTS2020_TrainingData/MICCAI_BraTS2020_TrainingData"
  proc_root: "braintumnet/data/processed_multiclass_full"
  modality: "multi"                      # FLAIR, T1, T1CE, T2
  img_size: 256
  slices_per_case: 30
  tumor_slice_ratio: 0.7                 # Higher ratio for tumor slices
  num_folds: 5
  fold: 0

train:
  epochs: 350                            # Longer training for larger model
  batch_size: 8                          # Reduced for larger model (37M params)
  lr: 3.0e-5                             # Lower LR for larger model
  weight_decay: 1.0e-4                   # Stronger regularization
  workers: 4

  # ============================================================
  # ULTIMATE LOSS (from Phase 1 - keep same)
  # ============================================================
  loss_type: "ultimate_multitask"
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5

  # Loss component weights
  dice_weight: 1.0
  focal_weight: 1.0
  iou_weight: 2.0                        # Emphasize IoU
  boundary_weight: 0.5

  # Focal loss - background ignored
  focal_alpha: [0.0, 0.4, 0.1]           # [bg=0.0, TC, ED]
  focal_gamma: 3.0

  # Class weights - TC emphasized
  class_weights: [1.0, 3.0, 2.0]         # [bg(ignored), TC, ED]

  ignore_background: true

  # Deep supervision
  aux_weight: 0.3

  # Optimizer
  optimizer: "adamw"
  grad_clip_norm: 1.0                    # Gradient clipping

  # Scheduler
  scheduler: "cosine"
  warmup_steps: 1000                     # Longer warmup for large model
  min_lr: 1.0e-6

  # Mixed precision
  amp: true
  grad_accum_steps: 2                    # Accumulate gradients (effective batch=16)

  # Early stopping
  early_stop_patience: 80
  val_interval: 1

  # Logging
  log_interval: 10
  save_interval: 10

# ============================================================
# LOGGING
# ============================================================
logging:
  log_dir: "logs"
  out_dir: "runs"
  save_dir: "checkpoints"
  exp_name: "braintumnet_phase2_small"
  use_tensorboard: true
  log_every_n_steps: 50
  save_top_k: 3

# ============================================================
# MODEL: Phase 2 Small - 37M parameters
# ============================================================
model:
  # Model type: v2 uses InstanceNorm, LeakyReLU, Residuals
  model_type: "v2"                       # Use BrainTumNetV2

  # Input/Output
  in_channels: 4
  num_classes_seg: 3                     # bg, TC, ED
  num_classes_cls: 2                     # HGG, LGG

  # Architecture - Phase 2 Small
  base: 48                               # Increased from 32 (1.5x)
  dim: 384                               # Increased from 256 (1.5x)
  patch_size: 8
  depth: 4                               # Increased from 2 (2x)
  n_heads: 8                             # Increased from 4 (2x)

  # Phase 2 features
  dropout: 0.15                          # Regularization for large model
  norm: "instance"                       # InstanceNorm (medical imaging standard)
  roi_stop_grad: true
  deep_supervision: true
  multi_scale_fusion: true               # Multi-scale fusion (NEW)

# ============================================================
# AUGMENTATION (same as Phase 1)
# ============================================================
augment:
  rotate_deg: 30
  hflip_p: 0.5
  vflip_p: 0.5
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]

# ============================================================
# EXPECTED RESULTS
# ============================================================
# Baseline V1: IoU 0.7263
# Phase 1: IoU 0.75-0.80 (improved loss)
# Phase 2 Small: IoU 0.80-0.82 (larger model + improvements)
#
# Training time: ~48 hours (RTX 3090, batch_size=8)
# GPU memory: ~12 GB
# Model size: 37.7M parameters
#
# Key improvements:
# - InstanceNorm: Better for medical imaging (+1-2% IoU)
# - LeakyReLU: Better gradients (+0.5-1% IoU)
# - Residual connections: Easier optimization (+1-2% IoU)
# - Larger capacity: More expressive (+2-3% IoU)
# - Multi-scale fusion: Better feature aggregation (+1% IoU)
#
# Total expected gain: +5-6% IoU from Phase 1
# ============================================================
