exp_name: "braintumnet_optimized"

data:
  raw_root: "data/raw"
  proc_root: "data/processed"
  modality: "t1ce"         # t1ce has best tumor contrast
  img_size: 256
  slices_per_case: 20
  tumor_slice_ratio: 0.7
  num_folds: 5
  fold: 0

train:
  epochs: 200
  batch_size: 16
  lr: 2.0e-4               # Higher initial LR
  weight_decay: 1.0e-4     # Stronger regularization
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5     # Balance both tasks
  scheduler: "plateau"     # Use plateau scheduler for adaptive LR
  amp: true
  early_stop_patience: 25  # Stop if no improvement for 25 epochs
  warmup_steps: 300        # For cosine scheduler
  min_lr: 1.0e-6           # Minimum LR (don't go to zero)

model:
  in_channels: 1
  num_classes_seg: 1
  num_classes_cls: 2
  base: 32                 # Original size (good balance)
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true      # Stabilize training

augment:
  rotate_deg: 20           # Moderate rotation
  hflip_p: 0.5
  vflip_p: 0.5

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
