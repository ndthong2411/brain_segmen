exp_name: "braintumnet_full_dataset"

data:
  raw_root: "data/raw"
  proc_root: "data/processed_full"  # Using full dataset
  modality: "t1ce"                   # T1CE has best tumor contrast
  img_size: 256
  slices_per_case: 30                # More slices per case (we have more data)
  tumor_slice_ratio: 0.5             # Balance tumor/non-tumor
  num_folds: 5
  fold: 0

train:
  epochs: 150                        # Can train longer with more data
  batch_size: 16                     # Adjust based on GPU memory
  lr: 2.0e-4                         # Higher initial LR
  weight_decay: 1.0e-4               # Stronger regularization
  workers: 4
  seg_loss_weight: 1.0
  cls_loss_weight: 0.5               # Balance both tasks
  scheduler: "plateau"               # Use plateau scheduler for adaptive LR
  amp: true                          # Mixed precision training
  early_stop_patience: 30            # More patience with larger dataset
  warmup_steps: 500                  # Warmup for first 500 steps
  min_lr: 1.0e-6                     # Minimum LR

model:
  in_channels: 1
  num_classes_seg: 1
  num_classes_cls: 2
  base: 32                           # Balanced model size
  patch_size: 8
  dim: 256
  n_heads: 4
  depth: 2
  roi_stop_grad: true                # Stabilize training

augment:
  rotate_deg: 20                     # Moderate rotation
  hflip_p: 0.5                       # Horizontal flip
  vflip_p: 0.5                       # Vertical flip

logging:
  out_dir: "runs"
  save_dir: "checkpoints"
  log_dir: "logs"
  use_tensorboard: true
